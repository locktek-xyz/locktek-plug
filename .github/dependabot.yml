version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ['dependencies']
    groups:
      # One PR for the toolchain instead of six.
      dev-tooling:
        patterns:
          - 'eslint*'
          - 'typescript*'
          - 'prettier'
          - 'turbo'
          - 'tsup'
          - 'vitest'
          - '@vitest/*'
          - 'husky'
        update-types: ['minor', 'patch']
    ignore:
      # Crypto and chain dependencies are reviewed one at a time, deliberately.
      - dependency-name: 'ethers'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tronweb'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    labels: ['dependencies', 'ci']

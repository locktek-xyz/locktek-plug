name: Release

# Publishing is gated three ways, and no npm token exists anywhere:
#   1. Only a strict semver tag starts this workflow, and a tag ruleset limits who can
#      create one.
#   2. The publish job runs in the `npm-publish` environment, which waits for a person
#      to approve it.
#   3. npm accepts the upload only from this workflow file, in this repository, from
#      that environment (trusted publishing over OIDC). Provenance is attached
#      automatically.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: verify and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No dependency cache: a release must not restore state that another workflow,
      # possibly running untrusted code, wrote.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm lint

      # The tag comes in through an environment variable, never interpolated into
      # the script, so a crafted tag name cannot become shell code.
      - name: Tag matches every package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for pkg in core mcp-server better-auth cli; do
            actual=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$actual" != "$version" ]; then
              echo "::error::@locktek/$pkg is at $actual but the tag is $TAG"
              exit 1
            fi
          done

      # Pack once here; the publish job uploads these exact files and runs no
      # project code at all.
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p tarballs
          for pkg in core better-auth mcp-server cli; do
            pnpm -C "packages/$pkg" pack --pack-destination "$PWD/tarballs"
          done
          (cd tarballs && sha256sum ./*.tgz | tee SHA256SUMS)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarballs
          path: tarballs/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for a one-time publish credential
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarballs
          path: tarballs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Check the tarballs and the npm CLI
        run: |
          set -euo pipefail
          (cd tarballs && sha256sum -c SHA256SUMS)
          # Trusted publishing needs npm 11.5.1 or later.
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) { console.error(`npm ${process.argv[1]} is too old for trusted publishing`); process.exit(1); }
          ' "$(npm --version)"

      # Dependency order: every other package depends on core, so a consumer must
      # never be able to install one that references a core version not yet on the
      # registry. A version that is already published is skipped, which makes a
      # partly failed release safe to re-run.
      - name: Publish
        run: |
          set -euo pipefail
          for pkg in core better-auth mcp-server cli; do
            tarball=$(ls tarballs/locktek-"$pkg"-[0-9]*.tgz)
            name="@locktek/$pkg"
            version=$(tar -xOzf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "SKIP    $name@$version is already published"
              continue
            fi
            echo "PUBLISH $name@$version"
            npm publish "$tarball" --access public
          done

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" --repo "$REPO" --verify-tag --generate-notes

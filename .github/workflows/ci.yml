name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing by default. Each job asks for exactly what it needs.
permissions: {}

# A superseded run on the same branch tells you nothing. Cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs: a tag can be moved to point at other code,
# a commit cannot. Dependabot proposes updates for these pins.
jobs:
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      # Full history, not just the tip: a key added in one commit and deleted in
      # the next is still public.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The binary rather than gitleaks-action, which needs a paid licence on
      # organisation repos. Checksum-verified so the scanner itself can't be
      # swapped out from under us.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$tarball" "$base/$tarball"
          curl -sSfL --retry 3 -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/

      - run: gitleaks git . --redact --verbose

  hidden-code:
    name: no code hidden off-screen
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The attack this repository has already seen: an obfuscated loader appended to
      # the last line of a config file, pushed past the edge of the editor by a long
      # run of spaces, so that it runs on `lint` or `build` while the diff looks clean.
      # Neither pattern occurs in legitimate source here.
      - name: Reject long whitespace runs followed by code
        run: |
          set -uo pipefail
          if git ls-files -z | xargs -0 grep -nIE '[[:blank:]]{150,}[^[:blank:]]' | cut -c1-200; then
            echo "::error::A line contains a long run of whitespace followed by more text. Inspect it before running anything in this checkout."
            exit 1
          fi

      - name: Reject very long lines in code and config files
        run: |
          set -euo pipefail
          git ls-files -z -- '*.js' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.mts' '*.cts' '*.json' ':!pnpm-lock.yaml' \
            | xargs -0 awk 'length($0) > 400 { print FILENAME ":" FNR ": " length($0) " characters"; found = 1 } END { exit found ? 1 : 0 }'

  build-and-test:
    name: build & test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm's version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      # Coverage rather than a bare test run, so the configured thresholds are
      # actually enforced. A gate that never executes is not a gate.
      - run: pnpm test:coverage

      - run: pnpm lint

      - run: pnpm format:check

  example:
    name: example app builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # The example is the first thing a new user runs. If it stops compiling
      # against the packages, the README is lying and nobody finds out from a
      # unit test.
      - run: pnpm --filter better-auth-nextjs-example typecheck

      # The example refuses to start without its secrets — deliberately. Supply
      # throwaway values so the build can run; they never leave this job.
      - run: pnpm --filter better-auth-nextjs-example build
        env:
          BETTER_AUTH_SECRET: ci-build-only-secret-not-used-anywhere-32
          BETTER_AUTH_URL: http://localhost:3000
          LOCKTEK_ENCRYPTION_KEY: ci-build-only-key-not-used-anywhere-0000
          DATABASE_URL: 'file:./ci.db'

  publish-dry-run:
    name: packages are publishable
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Catches a broken `files` list, a missing dist entry, or an unresolvable
      # workspace protocol *before* the tag is cut, not after.
      - name: Pack every package
        run: |
          set -euo pipefail
          for pkg in core mcp-server better-auth cli; do
            echo "::group::@locktek/$pkg"
            pnpm -C "packages/$pkg" pack --pack-destination /tmp/pack
            echo "::endgroup::"
          done
          ls -la /tmp/pack

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Blocking: anything high or critical in the dependency tree that ships or runs.
      - run: pnpm audit --prod --audit-level high

      # Reported, not blocking: development tooling that never reaches users.
      - name: Full audit, including dev tooling (informational)
        run: pnpm audit || echo "::warning::dev-tooling advisories above; review them"

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
